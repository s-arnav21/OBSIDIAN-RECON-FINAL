services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obsidian
      POSTGRES_PASSWORD: obsidian_password
      POSTGRES_DB: obsidian_recon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./FRONTEND:/app/frontend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: obsidian-recon_postgres_data
